name: Build

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install
      - name: Build
        run: bun run build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: chat
          path: dist/chat
